<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Chirag Soni — Full Stack Web Developer</title><desc id="desc">Animated anime-inspired developer hero with water-breathing blue energy, lightning and flame accents.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset=".55" stop-color="#10172b"/><stop offset="1" stop-color="#170d22"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
 <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#f97316"/><stop offset=".55" stop-color="#fb7185"/><stop offset="1" stop-color="#facc15"/></linearGradient>
 <linearGradient id="pink"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#64748b" stroke-opacity=".11"/></pattern>
 <style>
  text{font-family:Inter,Segoe UI,Arial,sans-serif} .muted{fill:#9aa9c5} .white{fill:#f8fafc}
  .eyebrow{font-size:12px;letter-spacing:3px;fill:#67e8f9;font-weight:700}
  .small{font-size:13px} .line{stroke:#64748b;stroke-opacity:.3}
  .pulse{animation:pulse 3s ease-in-out infinite} .drift{animation:drift 7s ease-in-out infinite}
  .wave{animation:wave 6s ease-in-out infinite;transform-origin:center}
  .spark{animation:spark 2.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes wave{0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
  @keyframes spark{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  @media(prefers-reduced-motion:reduce){.pulse,.drift,.wave,.spark{animation:none}}
 </style>
</defs>
<rect width="100%" height="100%" rx="24" fill="url(#bg)"/><rect width="100%" height="100%" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="298" rx="23" fill="none" stroke="#7dd3fc" stroke-opacity=".28"/>

<circle cx="820" cy="142" r="112" fill="none" stroke="url(#water)" stroke-width="2" stroke-opacity=".55" class="wave"/>
<circle cx="820" cy="142" r="82" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5 10" class="pulse"/>
<path d="M670 190 C740 95 815 255 950 115" fill="none" stroke="url(#water)" stroke-width="9" stroke-linecap="round" opacity=".7" filter="url(#glow)" class="wave"/>
<path d="M690 218 C760 135 840 260 970 155" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" opacity=".8" class="wave"/>
<path d="M870 38l-18 42 24-8-22 48" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" filter="url(#glow)" class="spark"/>
<path d="M930 215c-18-28 17-35 8-62 31 26 31 51 9 67 3-18-8-20-17-5z" fill="url(#flame)" opacity=".85" class="drift"/>
<circle cx="740" cy="70" r="3" fill="#f9a8d4" class="spark"/><circle cx="940" cy="75" r="4" fill="#67e8f9" class="spark"/>
<text x="58" y="55" class="eyebrow">鬼滅の刃 // DEVELOPER PROFILE</text>
<circle cx="67" cy="91" r="5" fill="#4ade80" class="pulse"/><text x="82" y="96" class="small" fill="#86efac">FULL STACK DEVELOPER • INDIA</text>
<text x="58" y="151" class="white" font-size="48" font-weight="800">Hi, I'm Chirag</text>
<text x="60" y="188" fill="#7dd3fc" font-size="23" font-weight="700">Full Stack Developer</text>
<text x="60" y="220" class="muted" font-size="15">MERN Stack Developer • Building modern, scalable web experiences.</text>
<g transform="translate(60 252)"><rect width="142" height="27" rx="13" fill="#0e7490" fill-opacity=".22" stroke="#38bdf8" stroke-opacity=".6"/><text x="71" y="18" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700">WATER • REACT</text><rect x="153" width="125" height="27" rx="13" fill="#854d0e" fill-opacity=".2" stroke="#facc15" stroke-opacity=".6"/><text x="215" y="18" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">THUNDER • JS</text><rect x="289" width="115" height="27" rx="13" fill="#9f1239" fill-opacity=".2" stroke="#fb7185" stroke-opacity=".6"/><text x="346" y="18" text-anchor="middle" fill="#fecdd3" font-size="11" font-weight="700">FLAME • BUILD</text></g>

</svg>